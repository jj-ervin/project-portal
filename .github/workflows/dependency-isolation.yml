name: Dependency isolation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies from a clean checkout
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Test isolated runtime packages and application logic
        run: npm test
