<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bootdog · Project workflow</title><link rel="stylesheet" href="/workflow/style.css"></head>
<body>
  <header class="top"><button id="toggle-explorer" type="button" aria-controls="explorer" aria-expanded="true">☰ Explorer</button><div><strong>Bootdog</strong><span>project-portal workflow</span></div><button id="refresh" type="button">Refresh evidence</button></header>
  <div class="shell">
    <aside id="explorer" class="explorer" aria-label="Explorer"><div class="pane-head"><h2>Explorer</h2></div><div class="tabs" role="tablist" aria-label="Explorer views"><button type="button" data-explorer="Files" aria-selected="true">Files</button><button type="button" data-explorer="Git">Git</button><button type="button" data-explorer="Projects">Projects</button></div><div id="explorer-content" class="pane-scroll"></div></aside>
    <main class="center"><div class="pane-head"><div><p class="eyebrow">CURRENT DELIVERY</p><h1>Project workflow</h1></div><span id="git-head"></span></div><div class="tabs" role="tablist" aria-label="Dashboard views"><button type="button" data-view="Overview" aria-selected="true">Overview</button><button type="button" data-view="Delivery Gate">Delivery Gate</button><button type="button" data-view="Gaps">Gaps</button><button type="button" data-view="Roadmap">Roadmap</button></div><div id="dashboard" class="pane-scroll" role="tabpanel"></div></main>
    <aside class="reader" aria-label="Reader"><div class="pane-head"><h2>Reader</h2></div><div class="tabs" role="tablist" aria-label="Reader views"><button type="button" data-reader="SITREPs" aria-selected="true">SITREPs</button><button type="button" data-reader="Conversation">Conversation</button><button type="button" data-reader="File">File</button></div><div id="reader-content" class="pane-scroll" role="tabpanel"></div></aside>
    <section class="composer" aria-label="Chat input"><div class="tabs" role="tablist" aria-label="Input views"><button type="button" data-input="Codex" aria-selected="true">Codex</button><button type="button" data-input="Ollama">Ollama</button><button type="button" data-input="Notes">Notes</button></div><form id="chat-form"><div class="compose-row"><select id="session" aria-label="Conversation"></select><button type="button" id="new-session">New chat</button><select id="model" aria-label="Ollama model" hidden></select><button type="button" id="stop" hidden>Stop</button></div><label for="message" class="sr-only">Message</label><textarea id="message" rows="2" placeholder="Ask about the current gate…"></textarea><div class="compose-footer"><span id="chat-status" role="status">Read-only agent. Sending requires your click.</span><button type="submit" id="send">Send to Codex</button></div></form><div id="notes-form" hidden><label for="notes">Local notes</label><textarea id="notes" rows="3" placeholder="Saved in this browser only"></textarea></div></section>
  </div>
  <script src="/workflow/app.js"></script>
</body></html>
