<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProPro — Project Portal</title><style>
:root{font:16px/1.5 system-ui,sans-serif;color-scheme:light;--ink:#182334;--line:#d7dfe8;--accent:#2355a5}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f5f7fa}header{background:#14243b;color:white;padding:1rem 1.5rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}header p{margin:0;color:#d2dceb}h1{font-size:1.4rem;margin:0}h2{margin-top:0}main{max-width:1160px;margin:auto;padding:1.25rem}.layout{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:1rem}section,aside{background:white;border:1px solid var(--line);border-radius:12px;padding:1rem}button,input,select,textarea{font:inherit}button{border:1px solid #b4c2d2;border-radius:8px;background:white;padding:.5rem .75rem;cursor:pointer;color:var(--ink)}button:hover{background:#e9f1ff}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #f5b544;outline-offset:2px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#173d7b}.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.stack{display:grid;gap:.75rem}label{display:grid;gap:.25rem;font-weight:600}input,textarea,select{width:100%;padding:.55rem;border:1px solid #aebccc;border-radius:7px}textarea{min-height:75px}small,.muted{color:#526276}.project{display:block;width:100%;text-align:left;margin:.4rem 0}.project[aria-current=true]{border-color:var(--accent);background:#e8f0ff;font-weight:700}.pill{display:inline-block;border-radius:20px;background:#e8edf4;padding:.15rem .55rem;font-size:.8rem;margin:.15rem}.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}.tabs button[aria-selected=true]{background:#dceaff;border-color:var(--accent);font-weight:700}.item{border-top:1px solid var(--line);padding:.65rem 0}.item:first-child{border:0}.hidden{display:none!important}.status{min-height:1.4rem;color:#245f37}.empty{padding:1.2rem;background:#f5f7fa;border-radius:8px}.hint{font-size:.9rem;color:#526276}fieldset{border:1px solid var(--line);border-radius:8px}fieldset label{display:inline-flex;align-items:center;font-weight:400;margin:.4rem .7rem .4rem 0}fieldset input{width:auto}@media(max-width:700px){.layout{grid-template-columns:1fr}header{padding:1rem}main{padding:.7rem}}
</style></head><body><header><div><h1>ProPro <small style="color:#d2dceb">/ Project Portal</small></h1><p>One place to manage the work you do, however you work.</p></div><div class="row"><button id="export">Export JSON</button><label style="color:white">Import JSON <input id="import" type="file" accept="application/json,.json"></label></div></header>
<main><p id="message" class="status" role="status" aria-live="polite"></p><div class="layout"><aside><div class="row between"><h2>Projects</h2><button id="new" class="primary">New project</button></div><div id="projects" aria-label="Project list"></div><p class="hint">Saved in this browser only. Export regularly; no cloud sync.</p></aside><section id="detail" aria-label="Project workspace"></section></div></main>
<script>
'use strict';
const KEY='propro-project-portal-v1',CAPS=['Construction','Research','Freelance','Development','Creative','Business'];
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data={version:1,projects:[]},selected=null,tab='Overview';
function validate(v){if(!v||v.version!==1||!Array.isArray(v.projects)||v.projects.length>500)throw Error('Unsupported project file');const ids=new Set();for(const p of v.projects){if(!p||typeof p.id!=='string'||!p.id||ids.has(p.id)||typeof p.name!=='string'||p.name.length>200||!Array.isArray(p.capabilities)||!p.capabilities.every(c=>CAPS.includes(c))||!Array.isArray(p.items)||!Array.isArray(p.resources)||!Array.isArray(p.evidence)||!Array.isArray(p.links))throw Error('Invalid project data');ids.add(p.id);for(const field of ['items','resources','evidence','links']){if(p[field].length>1000||!p[field].every(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&x.title.length<=1000))throw Error('Invalid '+field)}}return v}
try{const stored=localStorage.getItem(KEY);if(stored)data=validate(JSON.parse(stored))}catch(e){$('message').textContent='Saved data could not be read. Export or import a valid backup.'}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();notice('Saved locally.')}
function notice(s){$('message').textContent=s}
function current(){return data.projects.find(p=>p.id===selected)}
function addProject(name,caps){const p={id:uid(),name,capabilities:caps,items:[],resources:[],evidence:[],links:[]};data.projects.push(p);selected=p.id;tab='Overview';save()}
function render(){const p=current();$('projects').innerHTML=data.projects.map(x=>'<button class="project" data-project="'+esc(x.id)+'" aria-current="'+(x.id===selected)+'">'+esc(x.name)+'</button>').join('')||'<p class="empty">No projects yet.</p>';if(!p){$('detail').innerHTML='<h2>Welcome to ProPro</h2><p>Create a project to start managing work across disciplines.</p>';return}
const tabs=['Overview','Tasks','Resources','Evidence','Links',...p.capabilities];if(!tabs.includes(tab))tab='Overview';
let body='';
if(tab==='Overview')body='<p>Capabilities: '+(p.capabilities.map(c=>'<span class="pill">'+esc(c)+'</span>').join('')||'None selected')+'</p><p>Tasks: '+p.items.length+' · Resources: '+p.resources.length+' · Evidence: '+p.evidence.length+' · Links: '+p.links.length+'</p><form id="caps-form"><fieldset><legend>Project capabilities</legend>'+CAPS.map(c=>'<label><input type="checkbox" name="cap" value="'+c+'" '+(p.capabilities.includes(c)?'checked':'')+'>'+c+'</label>').join('')+'</fieldset><p><button class="primary">Save capabilities</button></p></form>';
else if(['Tasks','Resources','Evidence','Links'].includes(tab)){const key={Tasks:'items',Resources:'resources',Evidence:'evidence',Links:'links'}[tab];body='<form id="entry-form" class="stack"><label>New '+tab.toLowerCase()+' entry<input name="title" maxlength="1000" required placeholder="Describe the entry"></label><button class="primary">Add '+tab.toLowerCase()+' entry</button></form><div>'+p[key].map(x=>'<div class="item row between"><span>'+esc(x.title)+'</span><button data-remove="'+esc(x.id)+'" data-kind="'+key+'" aria-label="Remove '+esc(x.title)+'">Remove</button></div>').join('')+'</div>'+(p[key].length?'':'<p class="empty">No entries yet.</p>')}
else body='<h3>'+esc(tab)+' workspace</h3><p>This capability is selected for the project. Specialized editors are not implemented yet; use shared Tasks, Resources and Evidence now.</p>';
$('detail').innerHTML='<div class="row between"><h2>'+esc(p.name)+'</h2><button id="rename">Rename</button></div><div class="tabs" role="tablist" aria-label="Project views">'+tabs.map(t=>'<button role="tab" aria-selected="'+(t===tab)+'" data-tab="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div><div role="tabpanel">'+body+'</div>';
}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.project){selected=t.dataset.project;tab='Overview';render()}if(t.dataset.tab){tab=t.dataset.tab;render()}if(t.dataset.remove){const p=current();p[t.dataset.kind]=p[t.dataset.kind].filter(x=>x.id!==t.dataset.remove);save()}if(t.id==='rename'){const p=current(),name=prompt('Project name',p.name);if(name&&name.trim()){p.name=name.trim().slice(0,200);save()}}});
document.addEventListener('submit',e=>{if(e.target.id==='caps-form'){e.preventDefault();current().capabilities=[...e.target.querySelectorAll('input:checked')].map(x=>x.value);save()}if(e.target.id==='entry-form'){e.preventDefault();const key={Tasks:'items',Resources:'resources',Evidence:'evidence',Links:'links'}[tab],title=e.target.elements.title.value.trim();if(title){current()[key].push({id:uid(),title});save()}}});
$('new').onclick=()=>{const name=prompt('New project name');if(name&&name.trim())addProject(name.trim().slice(0,200),[])};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='propro-projects.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice('Exported project backup.')};
$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5_000_000)throw Error('File too large');const next=validate(JSON.parse(await file.text()));if(!confirm('Replace all locally saved projects with imported data?'))return;data=next;selected=null;tab='Overview';save();notice('Imported project backup.')}catch(err){notice('Import failed: '+err.message)}finally{e.target.value=''}};
render();
</script></body></html>
